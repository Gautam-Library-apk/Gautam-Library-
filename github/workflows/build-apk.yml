
name: Build Gautam Library APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make Tailwind and PDF libraries offline inside APK
        run: |
          curl -sL -A "Mozilla/5.0" "https://cdn.tailwindcss.com" -o app/src/main/assets/tailwind.js || true
          if [ -s app/src/main/assets/tailwind.js ] && [ $(wc -c < app/src/main/assets/tailwind.js) -gt 50000 ]; then
            sed -i 's|https://cdn.tailwindcss.com|tailwind.js|g' app/src/main/assets/index.html || true
          else
            rm -f app/src/main/assets/tailwind.js
          fi
          curl -sL "https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" -o app/src/main/assets/html2pdf.bundle.min.js || true
          if [ -s app/src/main/assets/html2pdf.bundle.min.js ] && [ $(wc -c < app/src/main/assets/html2pdf.bundle.min.js) -gt 50000 ]; then
            sed -i 's|https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js|html2pdf.bundle.min.js|g' app/src/main/assets/index.html || true
          else
            rm -f app/src/main/assets/html2pdf.bundle.min.js
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gautam-Library-APK
          path: app/build/outputs/apk/debug/app-debug.apk
